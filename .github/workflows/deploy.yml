name: Build and Deploy to VPS

on:
  push:
    branches:
      - payrollPayslip  # Trigger deployment when pushing to the `main` branch (can be any branch you prefer)

jobs:
  build-and-deploy:
    runs-on: windows-latest  # Use Windows runner to build .NET code (or any other platform as per your project)

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up .NET (if you're building an ASP.NET Core app)
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '8.0'  # Replace with the version your project uses

    # Step 3: Restore dependencies (for .NET projects)
    - name: Restore dependencies
      run: dotnet restore

    # Step 4: Build the project (for .NET projects)
    - name: Build the project
      run: dotnet build --configuration Release

   - name: Publish the project
      run: |
        # Create a folder within the GitHub workspace
        $publishFolder = "$env:GITHUB_WORKSPACE\publish"
        
        # Create the directory if it doesn't exist
        New-Item -ItemType Directory -Force -Path $publishFolder
        
        # Publish the project to the created directory
        dotnet publish --configuration Release --output $publishFolder
        
        # List contents of the publish directory for debugging
        Get-ChildItem -Recurse $publishFolder